# Render.com 部署設定（Web Service 支援長時間 WebSocket 連線，自動提供 HTTPS／WSS）
# 車手帳號資料庫存放在持久化磁碟 /data；沒有磁碟時，每次重新部署資料都會消失。
# Render 的持久化磁碟需要付費方案（starter 以上）。
services:
  - type: web
    name: neon-night-drive
    runtime: node
    plan: starter
    rootDir: neon-night-drive
    buildCommand: npm install --omit=dev
    startCommand: node --disable-warning=ExperimentalWarning server/server.js
    healthCheckPath: /healthz
    numInstances: 1          # 房間與 SQLite 都在單一執行個體上，請勿水平擴充
    disk:
      name: nnd-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
      - key: RECONNECT_GRACE_MS
        value: "30000"
